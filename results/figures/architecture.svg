<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 730" role="img" aria-labelledby="title desc"><title id="title">ForgeCNN architecture</title><desc id="desc">Two convolution layers, one pooling layer, flatten and a two-layer classifier. Output ten logits.</desc><rect width="680" height="730" fill="#f5f7fa"/><rect x="100" y="20" width="480" height="76" rx="4" fill="#e1ebf5" stroke="#305a91"/><text x="340" y="49" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#18344d">Input</text><text x="340" y="78" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#305a91">N × 1 × 8 × 8</text><path d="M340 97v21m-5-6 5 6 5-6" fill="none" stroke="#305a91" stroke-width="2"/><rect x="100" y="120" width="480" height="76" rx="4" fill="#e1ebf5" stroke="#305a91"/><text x="340" y="149" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#18344d">Conv 1 + ReLU</text><text x="340" y="178" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#305a91">N × 16 × 8 × 8</text><path d="M340 197v21m-5-6 5 6 5-6" fill="none" stroke="#305a91" stroke-width="2"/><rect x="100" y="220" width="480" height="76" rx="4" fill="#e1ebf5" stroke="#305a91"/><text x="340" y="249" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#18344d">MaxPool 2 × 2</text><text x="340" y="278" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#305a91">N × 16 × 4 × 4</text><path d="M340 297v21m-5-6 5 6 5-6" fill="none" stroke="#305a91" stroke-width="2"/><rect x="100" y="320" width="480" height="76" rx="4" fill="#e1ebf5" stroke="#305a91"/><text x="340" y="349" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#18344d">Conv 2 + ReLU</text><text x="340" y="378" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#305a91">N × 32 × 4 × 4</text><path d="M340 397v21m-5-6 5 6 5-6" fill="none" stroke="#305a91" stroke-width="2"/><rect x="100" y="420" width="480" height="76" rx="4" fill="#e1ebf5" stroke="#305a91"/><text x="340" y="449" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#18344d">Flatten</text><text x="340" y="478" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#305a91">N × 512</text><path d="M340 497v21m-5-6 5 6 5-6" fill="none" stroke="#305a91" stroke-width="2"/><rect x="100" y="520" width="480" height="76" rx="4" fill="#e1ebf5" stroke="#305a91"/><text x="340" y="549" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#18344d">Linear + ReLU</text><text x="340" y="578" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#305a91">N × 64</text><path d="M340 597v21m-5-6 5 6 5-6" fill="none" stroke="#305a91" stroke-width="2"/><rect x="100" y="620" width="480" height="76" rx="4" fill="#e1ebf5" stroke="#305a91"/><text x="340" y="649" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#18344d">Linear logits</text><text x="340" y="678" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#305a91">N × 10</text></svg>